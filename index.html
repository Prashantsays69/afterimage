<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2EFE8" />
    <meta
      name="description"
      content="Afterimage turns an image into a practical, editable color system. Extract, refine, test WCAG contrast, and export CSS/JSON tokens directly in your browser."
    />
    <title>Afterimage: Image to Color Palette Workspace</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Afterimage — Image to Color Palette" />
    <meta
      property="og:description"
      content="Extract dominant colors from images, understand their proportions, check contrast, and export usable design tokens."
    />
    <meta property="og:image" content="/og-image.png" />
    <!-- Note: og:url intentionally omitted until production Vercel deployment URL is finalized -->

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Afterimage — Image to Color Palette" />
    <meta
      name="twitter:description"
      content="Extract dominant colors from images, understand their proportions, check contrast, and export usable design tokens."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink font-body antialiased selection:bg-signal-red selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
